<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TicTacToe</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
<section id="menu-screen" class="screen active" aria-label="Menu">
  <div class="menu">
    <div class="mode-buttons"><button class="mode-button" id="pvp-button">PvP</button><button class="mode-button" id="pvc-button">PvC</button></div>
    <div class="menu-actions"><button class="text-button" id="export-button">Exportar resultados JSON</button><button class="text-button" id="import-button">Importar</button><input type="file" id="import-file" accept="application/json,.json" hidden></div>
  </div>
</section>
<section id="difficulty-screen" class="screen" aria-label="Dificuldade">
  <div class="menu"><div class="difficulty-buttons"><button class="difficulty-button" data-difficulty="easy">Fácil</button><button class="difficulty-button" data-difficulty="medium">Médio</button><button class="difficulty-button" data-difficulty="hard">Difícil</button></div><div class="menu-actions"><button class="text-button" id="difficulty-back">Voltar</button></div></div>
</section>
<section id="game-screen" class="screen" aria-label="Partida">
  <div class="game-layout">
    <div class="controls"><button class="round-button" id="restart-button">Reiniciar</button><button class="round-button" id="menu-button">Menu</button></div>
    <div class="arena">
      <div class="player player-one active" id="player-one"><div class="orb">P1</div><div class="player-label">P1</div></div>
      <div class="board-area"><div class="status" id="status" aria-live="polite">Vez de P1</div><div class="board" id="board" role="group" aria-label="Tabuleiro"></div></div>
      <div class="player player-two" id="player-two"><div class="orb" id="opponent-orb">P2</div><div class="player-label" id="opponent-name">P2</div></div>
    </div>
    <div class="score" id="score" aria-label="Placar da partida"></div>
  </div>
</section>
</main>
<div class="end-overlay" id="end-overlay" role="dialog" aria-modal="true" aria-labelledby="end-result"><div class="end-card"><div class="end-result" id="end-result">P1 venceu</div><div class="end-actions"><button class="round-button" id="rematch-button">Revanche</button><button class="round-button" id="end-menu-button">Menu</button></div></div></div>
<script src="script.js" defer></script>
</body>
</html>
